<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⌨️ 打字速度测试</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>⌨️ 打字速度测试</h1>
    <p class="subtitle">60 秒 · 一段中文 · 看看你专注起来有多快</p>
  </header>

  <main>
    <!-- ① 控制条：开始按钮 + 倒计时 -->
    <section class="card">
      <div class="control">
        <button id="start-btn" class="btn-primary">开始测试</button>
        <div class="countdown">剩余 <span id="time-left">60</span> 秒</div>
      </div>

      <!-- ② 原文区：每个字一个 span，敲对变绿敲错变红（由 script.js 生成） -->
      <div id="text-display" class="text-display"></div>

      <!-- ③ 输入区：点开始后解锁 -->
      <textarea id="input-area" rows="3" placeholder="点「开始测试」后，把上面的文章打进这里……"></textarea>
    </section>

    <!-- ④ 成绩区 -->
    <section class="card result-card">
      <h2>成绩</h2>
      <div class="scores">
        <div class="score">
          <p class="num" id="wpm">--</p>
          <p class="label">WPM（每分钟正确字数）</p>
        </div>
        <div class="score">
          <p class="num" id="accuracy">--</p>
          <p class="label">正确率</p>
        </div>
        <div class="score">
          <p class="num" id="wrong">--</p>
          <p class="label">打错的字数</p>
        </div>
      </div>
      <p id="comment" class="comment"></p>
    </section>
  </main>

  <footer>
    <a href="https://liuandi-dev.github.io/homepage/" target="_blank">← 回我的主页</a>
    <p>Andy · 100 项目挑战 · 项目 #010</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
